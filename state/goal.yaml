schema_version: 1
generated_at: "2026-05-23"

# ------------------------------------------------------------------
# Calm Turtle — Hermes goal file
# Written by the Hermes onboarding agent. Hermes reads this file on
# every reflection cycle to score outcomes and choose hypotheses.
# ------------------------------------------------------------------

universe: multi_strategy_retail_portfolio
assets:
  - SPY     # dual_momentum_taa (60%)
  - IEF     # dual_momentum_taa bond leg
  - GLD     # dual_momentum_taa + gold_permanent_overlay (10%)
  - SHV     # cash floor
  # large_cap_momentum_top5 universe (30%):
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - META
  - TSLA
  - JPM
  - BAC
  - V
  - MA
  - JNJ
  - UNH
  - PFE
  - WMT
  - COST
  - HD
  - XOM
  - ORCL
  - CSCO

# Success / failure thresholds (30-day rolling window)
target_return_30d: 0.0075          # success — +0.75% per 30d ≈ 9% annual
max_drawdown:      0.12            # failure — 12% portfolio drawdown (circuit-breaker OUT trigger)
min_sharpe:        0.8             # quality bar — annualised Sharpe on closed trades
failure_below:     -0.04           # score floor — steeply negative below this

# Reflection cadence
reflection_every:  10              # reflect after every N closed trades
one_variable_only: true            # scientific-method guardrail — Hermes changes exactly one thing

# Scoring weights for composite score in [-1, +1]
score_weights:
  return_vs_target: 0.50
  drawdown_vs_max:  0.30
  sharpe_vs_min:    0.20

# Source files Hermes reads on each reflection cycle
worker_paths:
  trades_log:       trades/paper/log.csv
  positions:        trades/paper/positions.json
  strategy:         config/strategy_rules.yaml
  risk_limits:      config/risk_limits.yaml
  hypotheses:       state/hypotheses.jsonl
  history_dir:      state/history/
  heartbeat:        state/heartbeat.json
